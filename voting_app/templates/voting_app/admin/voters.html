{% extends "voting_app/base.html" %}{% block content %}<h2 class="mb-4">Voters Registry</h2><div class="glass p-3 mb-3"><form class="d-flex gap-2"><input class="form-control" name="search" value="{{ search }}" placeholder="Search name, email or voter ID"><button class="btn btn-info">Search</button></form></div><div class="glass p-3 table-responsive"><table class="table table-dark"><thead><tr><th>Name</th><th>Voter ID</th><th>Email</th><th>Age</th><th>Status</th><th>Actions</th></tr></thead><tbody>{% for v in voters %}<tr><td>{{ v.name }}</td><td>{{ v.voter_id }}</td><td>{{ v.email }}</td><td>{{ v.age }}</td><td>{{ v.status }}</td><td><a class="btn btn-sm btn-outline-warning" href="{% url 'voter_toggle' v.id %}">Toggle</a> <a class="btn btn-sm btn-outline-danger" href="{% url 'voter_delete' v.id %}" onclick="return confirm('Delete voter?')">Delete</a></td></tr>{% empty %}<tr><td colspan="6">No voters found.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
